[project]
name = "dialycore-backend"
version = "1.0.0"
description = "Open-source hemodialysis unit records and workflow management API."
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic[email]>=2.6",
  "sqlalchemy>=2.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "python-dotenv>=1.0",
  "bcrypt>=4.0,<4.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
