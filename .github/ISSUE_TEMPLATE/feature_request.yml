name: Feature request
description: Propose an improvement using institution-neutral, synthetic examples
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Explain the user need and domain basis without including real or derived patient, staff, institutional, credential, or operational data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: Who needs this and what outcome are they trying to achieve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and any role or workflow impact.
    validations:
      required: true
  - type: textarea
    id: domain_basis
    attributes:
      label: Domain basis and assumptions
      description: Explain whether this reflects expert input, published guidance, local practice, or a technical improvement.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this request contains only independently authored synthetic examples and no real or derived sensitive data.
          required: true
