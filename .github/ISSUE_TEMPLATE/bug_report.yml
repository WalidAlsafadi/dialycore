name: Bug report
description: Report a reproducible DialyCore defect without sensitive data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use only independently generated demo data. Never attach or paste real patient/staff information, clinical exports, credentials, logs, databases, spreadsheets, screenshots, or private infrastructure details.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem using synthetic examples only.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the demo seed and safe steps needed to reproduce it.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this report contains no real or derived patient, staff, credential, institution, or private operational data.
          required: true
