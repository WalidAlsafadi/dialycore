name: dialycore

services:
  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////data/dialycore_demo.db
      JWT_SECRET: docker-local-demo-only-change-before-deployment
      CORS_ORIGINS: http://localhost:3000
      ENABLE_DEMO_GUEST: "true"
    command: >-
      sh -c "test -f /data/dialycore_demo.db || python generate_demo_data.py
      --output /data/dialycore_demo.db --patients 300 --seed 2026;
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - demo_data:/data

  frontend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  demo_data:
